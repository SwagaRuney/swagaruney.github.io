<style>
  .NEW, .NEW:after {
    /* Start the shake animation and make the animation last for 0.5 seconds */
    animation: color 15s;
    
    /* When the animation is finished, start again */
    animation-iteration-count: infinite;
    content: " (NEW)";
  }

  @keyframes color {
    0% {
      color: #b177b1; /* Blue */
    }
    50% {
      color: #f2ff00; /* burple */
    }
    100% {
      color: #b177b1; /* Blue */
    }
  }
</style>
